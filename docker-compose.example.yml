services:
  openinfrahub:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: openinfrahub
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config/examples:/app/config:ro
      - ./public/images:/app/public/images:ro
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${OPENINFRAHUB_ALLOWED_HOSTS:-localhost,127.0.0.1}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
